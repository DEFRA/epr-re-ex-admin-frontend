name: Check Pull Request

on:
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pr-prep:
    name: Preparation
    runs-on: ubuntu-latest
    steps:
      - name: Prepare PR
        uses: DEFRA/epr-re-ex-service/.github/actions/pr-preparation@main

  test-and-scan:
    name: Test and Scan
    runs-on: ubuntu-latest
    needs: pr-prep
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test and Scan
        uses: DEFRA/epr-re-ex-service/.github/actions/test-and-scan@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          build-command: npm run build:frontend

  knip:
    name: Knip
    runs-on: ubuntu-latest
    needs: pr-prep
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts --no-audit

      - run: npm run knip

  # The one context the branch ruleset requires from this workflow, so every
  # blocking job must appear in `needs` below.
  pr-checks:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - pr-prep
      - test-and-scan
      - knip
    if: always()
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED: 3
        run: |
          echo "$RESULTS"
          COUNT=$(echo "$RESULTS" | jq -r 'length')
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "Expected $EXPECTED jobs in needs, found $COUNT: update EXPECTED when you add a job"
            exit 1
          fi
          NOT_PASSED=$(echo "$RESULTS" | jq -r 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | .[] | "\(.key)=\(.value.result)"')
          if [ -n "$NOT_PASSED" ]; then
            echo "Did not pass: $(echo "$NOT_PASSED" | tr '\n' ' ')"
            exit 1
          fi
          echo "Every pull request check passed"

  type-check-prod:
    name: Lint Types - Prod
    runs-on: ubuntu-latest
    needs: pr-prep
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: DEFRA/epr-re-ex-service/.github/actions/lint-types@main
        with:
          npm-script: lint:types
          tsconfig: jsconfig.typecheck.json
          label: Prod
          comment-header: lint-types-prod
          fail-on: all

  type-check-tests:
    name: Lint Types - Tests
    runs-on: ubuntu-latest
    needs: pr-prep
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: DEFRA/epr-re-ex-service/.github/actions/lint-types@main
        with:
          fail-on: all

  typecheck-burndown:
    name: Typecheck strictness burndown
    runs-on: ubuntu-latest
    needs: pr-prep
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: DEFRA/epr-re-ex-service/.github/actions/typecheck-burndown@main

  test-journey:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    needs: pr-prep
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for matching journey test branch
        id: journey-branch
        run: |
          BRANCH="${{ github.head_ref }}"
          if git ls-remote --heads https://github.com/DEFRA/epr-re-ex-journey-tests.git "$BRANCH" | grep -q .; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Record build start time
        id: build-timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - run: docker build -t defradigital/epr-re-ex-admin-frontend:${{github.sha}} .

      - name: Record test start time
        id: test-timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run journey tests on ${{ steps.journey-branch.outputs.ref }}
        uses: DEFRA/epr-re-ex-journey-tests/run-journey-tests@main
        with:
          epr-re-ex-admin-frontend: ${{github.sha}}
          branch: ${{ steps.journey-branch.outputs.ref }}
          test-scope: admin

      - name: Write journey test summary
        if: always()
        uses: DEFRA/epr-re-ex-service/.github/actions/journey-test-summary@main
        with:
          build-start: ${{ steps.build-timer.outputs.start }}
          test-start: ${{ steps.test-timer.outputs.start }}
